<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</helmet>
<sc-if value="{{ isCobertura }}" hint-placeholder-val="{{ false }}">
<header style="position:sticky;top:0;z-index:100;background:linear-gradient(90deg,#1B3A6B 0%,#4A9FD4 100%);font-family:'Hanken Grotesk',system-ui,sans-serif">
  <div style="max-width:1280px;margin:0 auto;padding:0 24px;height:66px;display:flex;align-items:center;justify-content:space-between;gap:24px">
    <a href="{{ coberturaHomeHref }}" style="display:flex;align-items:center;gap:10px;text-decoration:none">
      <img src="assets/cmd-logo.png" alt="CMD" style="height:30px;width:30px;object-fit:contain;border-radius:50%;background:#fff" />
      <span style="font-size:16.5px;font-weight:700;color:#fff">Cobertura Médica Deportiva</span>
    </a>
    <sc-if value="{{ showDesktopNav }}" hint-placeholder-val="{{ true }}">
      <nav style="display:flex;align-items:center;gap:26px">
        <sc-for list="{{ coberturaNavItems }}" as="n" hint-placeholder-count="5">
          <a href="{{ n.href }}" style="text-decoration:none;font-size:14.5px;font-weight:500;color:rgba(255,255,255,0.92)" style-hover="color:#fff">{{ n.label }}</a>
        </sc-for>
        <a href="{{ coberturaContactHref }}" style="text-decoration:none;font-size:14px;font-weight:600;color:#0B2A4A;background:#fff;padding:10px 18px;border-radius:9px" style-hover="background:#EAF2FA">Contacto</a>
        <span style="display:flex;gap:6px;font-size:18px;line-height:1">🇪🇸 🇺🇸</span>
      </nav>
    </sc-if>
    <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ toggleMobile }}" aria-label="Menú" style="display:flex;flex-direction:column;justify-content:center;gap:5px;width:44px;height:44px;background:none;border:1px solid rgba(255,255,255,0.4);border-radius:11px;cursor:pointer;align-items:center">
        <span style="width:18px;height:2px;background:#fff;border-radius:2px"></span>
        <span style="width:18px;height:2px;background:#fff;border-radius:2px"></span>
        <span style="width:18px;height:2px;background:#fff;border-radius:2px"></span>
      </button>
    </sc-if>
  </div>
  <sc-if value="{{ showMobilePanel }}" hint-placeholder-val="{{ false }}">
    <div style="border-top:1px solid rgba(255,255,255,0.18);background:#1B3A6B;padding:14px 24px 22px;display:flex;flex-direction:column;gap:4px">
      <sc-for list="{{ coberturaNavItems }}" as="n" hint-placeholder-count="5">
        <a href="{{ n.href }}" style="padding:13px 12px;border-radius:10px;text-decoration:none;font-size:15.5px;font-weight:500;color:#fff">{{ n.label }}</a>
      </sc-for>
      <a href="{{ coberturaContactHref }}" style="margin-top:8px;text-align:center;text-decoration:none;font-size:15px;font-weight:600;color:#0B2A4A;background:#fff;padding:14px;border-radius:11px">Contacto</a>
    </div>
  </sc-if>
</header>
</sc-if>

<sc-if value="{{ isNotCobertura }}" hint-placeholder-val="{{ true }}">
<header style="position:sticky;top:0;z-index:100;background:rgba(255,255,255,0.88);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid #E6EDF4;font-family:'Hanken Grotesk',system-ui,sans-serif">
  <div style="max-width:1200px;margin:0 auto;padding:0 24px;height:74px;display:flex;align-items:center;justify-content:space-between;gap:24px">

    <a href="{{ homeHref }}" style="display:flex;align-items:center;text-decoration:none">
      <img src="assets/1d1e76b2-6327-4ecf-838d-faecd1b6a08d.png" alt="Integra Medical Group" style="height:42px;width:auto;display:block" />
    </a>

    <sc-if value="{{ showDesktopNav }}" hint-placeholder-val="{{ true }}">
      <nav style="display:flex;align-items:center;gap:30px">
        <div style="position:relative" onMouseEnter="{{ openDropdown }}" onMouseLeave="{{ closeDropdown }}">
          <button onClick="{{ toggleDropdown }}" style="display:flex;align-items:center;gap:6px;background:none;border:none;cursor:pointer;font-family:inherit;font-size:15px;font-weight:500;color:#33455C;padding:6px 0">
            Unidades de negocio
            <span style="font-size:10px;color:#8AA0B8;transform:translateY(1px)">▾</span>
          </button>
          <sc-if value="{{ dropdownOpen }}" hint-placeholder-val="{{ false }}">
            <div style="position:absolute;top:100%;left:-12px;padding-top:10px;background:transparent"><div style="background:#fff;border:1px solid #E6EDF4;border-radius:14px;box-shadow:0 18px 44px rgba(11,42,74,0.16);padding:8px;min-width:300px;display:flex;flex-direction:column;gap:2px">
              <sc-for list="{{ units }}" as="u" hint-placeholder-count="4">
                <a href="{{ u.href }}" style="display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;text-decoration:none" style-hover="background:#F2F7FB">
                  <span style="width:9px;height:9px;border-radius:50%;flex:none;background:{{ u.color }}"></span>
                  <span style="display:flex;flex-direction:column;gap:2px">
                    <span style="font-size:14.5px;font-weight:600;color:#0B2A4A;line-height:1.2">{{ u.name }}</span>
                    <span style="font-size:12px;color:#7A8BA0;line-height:1.2">{{ u.tag }}</span>
                  </span>
                </a>
              </sc-for>
            </div></div>
          </sc-if>
        </div>
        <sc-for list="{{ navItems }}" as="n" hint-placeholder-count="3">
          <a href="{{ n.href }}" style="text-decoration:none;font-size:15px;font-weight:500;color:#33455C" style-hover="color:#0E4F8B">{{ n.label }}</a>
        </sc-for>
        <a href="{{ contactHref }}" style="text-decoration:none;font-size:14.5px;font-weight:600;color:#fff;background:#0E4F8B;padding:11px 20px;border-radius:10px;box-shadow:0 6px 16px rgba(14,79,139,0.24)" style-hover="background:#0A3A66">Contactar</a>
      </nav>
    </sc-if>

    <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ toggleMobile }}" aria-label="Menú" style="display:flex;flex-direction:column;justify-content:center;gap:5px;width:44px;height:44px;background:none;border:1px solid #E6EDF4;border-radius:11px;cursor:pointer;align-items:center">
        <span style="width:18px;height:2px;background:#0B2A4A;border-radius:2px"></span>
        <span style="width:18px;height:2px;background:#0B2A4A;border-radius:2px"></span>
        <span style="width:18px;height:2px;background:#0B2A4A;border-radius:2px"></span>
      </button>
    </sc-if>
  </div>

  <sc-if value="{{ showMobilePanel }}" hint-placeholder-val="{{ false }}">
    <div style="border-top:1px solid #E6EDF4;background:#fff;padding:14px 24px 22px;display:flex;flex-direction:column;gap:4px">
      <span style="font-size:11px;font-weight:600;letter-spacing:0.14em;color:#8AA0B8;margin:8px 4px 6px">UNIDADES DE NEGOCIO</span>
      <sc-for list="{{ units }}" as="u" hint-placeholder-count="4">
        <a href="{{ u.href }}" style="display:flex;align-items:center;gap:12px;padding:13px 12px;border-radius:10px;text-decoration:none" style-active="background:#F2F7FB">
          <span style="width:9px;height:9px;border-radius:50%;flex:none;background:{{ u.color }}"></span>
          <span style="font-size:15.5px;font-weight:600;color:#0B2A4A">{{ u.name }}</span>
        </a>
      </sc-for>
      <div style="height:1px;background:#EDF2F7;margin:10px 4px"></div>
      <sc-for list="{{ navItems }}" as="n" hint-placeholder-count="3">
        <a href="{{ n.href }}" style="padding:13px 12px;border-radius:10px;text-decoration:none;font-size:15.5px;font-weight:500;color:#33455C">{{ n.label }}</a>
      </sc-for>
      <a href="{{ contactHref }}" style="margin-top:8px;text-align:center;text-decoration:none;font-size:15px;font-weight:600;color:#fff;background:#0E4F8B;padding:14px;border-radius:11px">Contactar</a>
    </div>
  </sc-if>
</header>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:74},&quot;current&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { isMobile: (typeof window !== 'undefined' && window.innerWidth < 980), mobileOpen: false, dropdownOpen: false };

  componentDidMount() {
    this._onResize = () => {
      const m = window.innerWidth < 980;
      if (m !== this.state.isMobile) this.setState({ isMobile: m, mobileOpen: false });
    };
    window.addEventListener('resize', this._onResize);
  }
  componentWillUnmount() { window.removeEventListener('resize', this._onResize); }

  renderVals() {
    const homeHref = 'Integra Medical Group.dc.html';
    const isCobertura = this.props.current === 'cobertura';
    const coberturaHomeHref = 'CMD-Cobertura.dc.html';
    const coberturaNavItems = [
      { label: 'Inicio', href: coberturaHomeHref },
      { label: 'Quiénes Somos', href: coberturaHomeHref + '#quienes-somos' },
      { label: 'Servicios', href: coberturaHomeHref + '#servicios' },
      { label: 'Consultas', href: coberturaHomeHref + '#consultas' },
      { label: 'Por qué elegirnos', href: coberturaHomeHref + '#por-que-elegirnos' },
    ];
    const units = [
      { name: 'CMD Cobertura Médica Deportiva', tag: 'Cobertura en campo y eventos', href: 'CMD-Cobertura.dc.html', color: '#1E73C9' },
      { name: 'Integra Personal', tag: 'Tercerización de personal para empresas', href: 'Integra-Personal.dc.html', color: '#188898' },
      { name: 'Vivam', tag: 'Cuidados domiciliarios', href: 'Vivam.dc.html', color: '#16A47E' },
      { name: 'CMD Tech', tag: 'Tecnología y software en salud', href: 'CMD-Tech.dc.html', color: '#4F5BD5' },
    ];
    const navItems = [
      { label: 'Nosotros', href: homeHref + '#nosotros' },
      { label: 'Dirección médica', href: homeHref + '#direccion' },
      { label: 'Contacto', href: homeHref + '#contacto' },
    ];
    return {
      homeHref, units, navItems,
      isCobertura, isNotCobertura: !isCobertura,
      coberturaHomeHref, coberturaNavItems,
      coberturaContactHref: coberturaHomeHref + '#contacto',
      contactHref: homeHref + '#contacto',
      isMobile: this.state.isMobile,
      showDesktopNav: !this.state.isMobile,
      mobileOpen: this.state.mobileOpen,
      showMobilePanel: this.state.isMobile && this.state.mobileOpen,
      dropdownOpen: this.state.dropdownOpen,
      toggleMobile: () => this.setState(s => ({ mobileOpen: !s.mobileOpen })),
      toggleDropdown: () => this.setState(s => ({ dropdownOpen: !s.dropdownOpen })),
      openDropdown: () => this.setState({ dropdownOpen: true }),
      closeDropdown: () => this.setState({ dropdownOpen: false }),
    };
  }
}
</script>
</body>
</html>
